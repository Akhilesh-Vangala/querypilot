name: querypilot
# Isolated synthetic development/rehearsal; see docs/DEPLOYMENT.md for private production settings.
x-runtime: &runtime
  DATABASE_URL: postgresql+psycopg://querypilot_app:local-app-password-only@db:5432/querypilot
  WAREHOUSE_DATABASE_URL: postgresql+psycopg://querypilot_reader:local-reader-password-only@db:5432/querypilot
  JWT_SECRET: local-development-compose-secret-000000000000000000000000
  AUTO_CREATE_SCHEMA: "false"
  ALLOW_LIVE_AI: "false"
  SEED_DEMO: "false"
  ALLOWED_ORIGINS: http://localhost:3007,http://127.0.0.1:3007
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: migration_owner
      POSTGRES_PASSWORD: local-owner-password-only
      POSTGRES_DB: querypilot
    ports: ["127.0.0.1:5437:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_owner -d querypilot"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment:
      <<: *runtime
      MIGRATION_DATABASE_URL: postgresql+psycopg://migration_owner:local-owner-password-only@db:5432/querypilot
      APP_DATABASE_PASSWORD: local-app-password-only
      WAREHOUSE_DATABASE_PASSWORD: local-reader-password-only
    command: ["python", "-m", "app.bootstrap", "--demo-users"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  api:
    build: ./backend
    environment:
      <<: *runtime
      DEMO_ACCOUNTS: "true"
    # Accounts come from the one-shot migration; runtime never reseeds.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8007", "--no-access-log"]
    ports: ["127.0.0.1:8007:8007"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: ./backend
    environment: *runtime
    stop_grace_period: 35s
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3007:8080"]
    depends_on:
      api: {condition: service_healthy}
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET: isolated-container-test-secret-000000000000000000000000000
volumes:
  pgdata:
