<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc"><title id="title">QueryPilot — analytical questions, executed evidence</title><desc id="desc">A bounded agentic analytics workbench with metric plans, read-only queries and inspectable results.</desc><rect width="1440" height="440" rx="18" fill="#0b0b0b"/><g stroke="#222"><path d="M900 0v440M1080 0v440M1260 0v440M0 110h1440M0 220h1440M0 330h1440"/></g><g font-family="Arial,Helvetica,sans-serif"><rect x="58" y="46" width="48" height="48" rx="10" fill="#eee"/><text x="72" y="80" font-size="32" font-weight="700">Q</text><text x="122" y="79" fill="#aaa" font-size="18" letter-spacing="3">AGENTIC ANALYTICS WORKBENCH</text><text x="58" y="176" fill="#f3f3f3" font-size="68" font-weight="700" letter-spacing="-3">QueryPilot</text><text x="61" y="229" fill="#ccc" font-size="26">Analytical questions. Executed evidence.</text><text x="61" y="276" fill="#999" font-size="18">Metric contracts → bounded investigation → read-only SQL → inspectable results</text><rect x="61" y="326" width="158" height="42" rx="6" fill="#eee"/><text x="82" y="353" font-size="16" fill="#111">LangGraph + SDK</text><rect x="235" y="326" width="196" height="42" rx="6" fill="#151515" stroke="#444"/><text x="257" y="353" font-size="16" fill="#ccc">PostgreSQL authority</text><rect x="447" y="326" width="222" height="42" rx="6" fill="#151515" stroke="#444"/><text x="466" y="353" font-size="16" fill="#ccc">Evidence before conclusions</text><g fill="#101010" stroke="#444"><rect x="955" y="100" width="410" height="235" rx="10"/><path d="M955 145h410"/></g><text x="982" y="129" fill="#bbb" font-size="13" letter-spacing="2">INVESTIGATION RECEIPT</text><text x="982" y="186" fill="#eee" font-size="19">✓ Scope + public metric plan</text><text x="982" y="229" fill="#ccc" font-size="19">✓ Executed SELECT-only query</text><text x="982" y="272" fill="#ccc" font-size="19">✓ Result hash + completeness</text><text x="982" y="311" fill="#777" font-size="13">Synthetic demo · live quality measured separately</text></g></svg>