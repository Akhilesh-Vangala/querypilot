server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    # Keep directory redirects relative behind the externally mapped port.
    absolute_redirect off;

    location /api/ {
        proxy_pass http://api:8007;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /uploads { try_files /index.html =404; }
    location = /uploads/ { try_files /index.html =404; }
    location = /uploads/index.html { try_files /index.html =404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
