name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: querypilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend and policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests --junitxml=artifacts/generated/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          path: artifacts/generated/
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build
  containers:
    name: Containers and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: docker compose up --build -d --wait db api worker frontend
      - run: docker compose --profile test run --build --rm tests
      - name: Database-enforced authority and four-worker queue
        env:
          DATABASE_URL: postgresql+psycopg://querypilot_app:local-app-password-only@127.0.0.1:5437/querypilot
          WAREHOUSE_DATABASE_URL: postgresql+psycopg://querypilot_reader:local-reader-password-only@127.0.0.1:5437/querypilot
        run: |
          docker compose stop worker
          python scripts/postgres_rehearsal.py
          docker compose start worker
      - run: python scripts/browser_smoke.py
      - name: API restart and persisted run smoke
        run: python scripts/restart_smoke.py
      - name: Container diagnostics
        if: always()
        run: docker compose ps -a && docker compose logs --no-color --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: artifacts/generated/
      - run: docker compose down -v
        if: always()
