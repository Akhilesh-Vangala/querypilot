version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      # React's renderer and types share peer requirements across dependency scopes.
      react-runtime-and-types:
        applies-to: version-updates
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      react-security:
        applies-to: security-updates
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
  - package-ecosystem: pip
    directory: /backend/requirements
    # Review Python updates with root pyproject.toml and uv.lock for Vercel parity.
    # The backend requirements directory alone does not update the deployment lock.
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
